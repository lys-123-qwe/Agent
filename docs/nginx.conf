# 前后端分离部署 - Nginx 配置
# 前端：chat-frontend 构建产物（dist/）由 Nginx 托管
# 后端：Spring Boot jar 独立运行在 8080
#
# 使用步骤：
#   1. cd chat-frontend && npm run build     # 生成 dist/
#   2. 把 dist/* 复制到 Nginx 前端目录（如 /var/www/chat-frontend）
#   3. 把本配置放入 Nginx conf.d/ 并 nginx -s reload
#   4. 访问 http://localhost 即可

server {
    listen 80;
    server_name localhost;

    # 前端静态资源（打包产物）
    root /var/www/chat-frontend;
    index index.html;

    # 单页应用：非 /api 请求都回 index.html（支持刷新路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的文件长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 反向代理（SSE 流式必须关缓冲）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;              # 关缓冲，SSE 才能流式
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
